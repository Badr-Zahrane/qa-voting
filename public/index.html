<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&amp;A Voting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Q&amp;A Voting</h1>

    <!-- #1 Create session (presenter) -->
    <section id="create-section">
      <h2>I'm the presenter</h2>
      <button id="create-btn">Create session</button>
      <div id="create-result" hidden>
        <p>Share this code with your audience:</p>
        <p class="code" id="new-code"></p>
        <a id="open-session-link" href="#">Open session &rarr;</a>
      </div>
    </section>

    <!-- #2 Join session with code (participant) -->
    <section id="join-section">
      <h2>I'm a participant</h2>
      <form id="join-form">
        <input type="text" id="join-code" placeholder="Session code, e.g. AB12" maxlength="4" required>
        <button type="submit">Join</button>
      </form>
      <p id="join-error" class="error"></p>
    </section>
  </main>

  <script src="js/home.js"></script>
</body>
</html>
